name: Update official stock closing prices

on:
  schedule:
    # 臺灣時間週一至週五 15:10，在官方盤後資料發布後更新。
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official closing prices
        run: python scripts/update_stock_prices.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stock-prices.json
          git diff --cached --quiet || git commit -m "chore: update official stock closing prices"
          git push
